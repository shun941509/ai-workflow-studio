<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>가상 한빛팀 신청 화면</title><style>body{font:18px system-ui;max-width:45rem;margin:3rem auto;padding:1rem}input,button{font:inherit;padding:.6rem}label{display:block;margin-top:1rem}:focus-visible{outline:3px solid #1858bc;outline-offset:3px}.error{color:#a51222}</style></head><body><h1>가상 신청 화면</h1><p>관찰 연습용 원본 화면입니다. 외부 전송은 없습니다.</p><form id="request"><label for="title">신청 이름 (필수)</label><input id="title" name="title" required aria-describedby="help error"><p id="help">업무를 식별할 수 있는 이름을 입력하세요.</p><p id="error" class="error" role="alert"></p><button type="submit">내용 확인</button></form><p id="result" role="status"></p><script>// This local demonstration never sends or stores form data.
const form=document.getElementById('request'),field=document.getElementById('title'),error=document.getElementById('error');form.noValidate=true;form.addEventListener('submit',event=>{event.preventDefault();const invalid=!field.value.trim();field.setAttribute('aria-invalid',String(invalid));error.textContent=invalid?'신청 이름을 입력하세요.':'';document.getElementById('result').textContent=invalid?'':'입력 확인 완료. 전송하지 않았습니다.';if(invalid)field.focus();});</script></body></html>
